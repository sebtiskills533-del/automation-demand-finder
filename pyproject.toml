[project]
name = "automation-demand-finder"
version = "1.0.0"
description = "Finds public automation requests, scores them with Claude, and tracks them in a dashboard."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
